<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050509">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>TamTam Community Dashboard</title>
<style>
  :root{--void:#050509;--white:#F8FAFF;--violet:#9358FF;--blue:#22C7FF;--pink:#FF4FC3;--mint:#4DFFD0}
  html,body,#root{margin:0;width:100vw;height:100dvh;background:var(--void);overflow:hidden;touch-action:none;
    overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;touch-action:none}
  .layer{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #core{position:fixed;inset:0;display:grid;place-items:center;background:var(--void);z-index:10;cursor:pointer;transition:opacity .8s;pointer-events:auto}
  #core.gone{opacity:0;pointer-events:none}
  #orb{width:min(30vmin,230px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff 0,var(--blue) 25%,var(--violet) 60%,var(--pink) 100%);
    box-shadow:0 0 90px 20px #9358FF88,0 0 220px 70px #22C7FF33;animation:pulse 2.4s ease-in-out infinite}
  #corehint{position:absolute;bottom:12vh;color:#F8FAFFaa;font-size:clamp(20px,3.4vmin,30px);letter-spacing:.05em}
  @keyframes pulse{50%{transform:scale(1.08)}}
  @media (prefers-reduced-motion:reduce){#orb{animation:none}}
  #toast{position:fixed;left:50%;bottom:calc(7vh + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:86vw;text-align:center;
    font-size:clamp(22px,3.6vmin,36px);text-shadow:0 0 24px var(--violet);opacity:0;transition:opacity .4s;z-index:6}
  #toast.on{opacity:1}
  .cur{position:fixed;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:3px solid var(--white);
    box-shadow:0 0 18px var(--blue);z-index:7;display:none;pointer-events:none;transition:transform .08s,background .08s,border-color .08s}
  .cur.candidate{border-color:var(--yellow,#FFE65C)}
  .cur.pinch{transform:scale(.62);background:#4DFFD0aa;border-color:var(--mint)}
  .cur.hover{border-color:var(--blue);transform:scale(1.2)}
  #cam{position:fixed;left:50%;top:6vh;width:min(36vw,360px);transform:translateX(-50%) scaleX(-1);border-radius:22px;
    opacity:.8;z-index:6;display:none;box-shadow:0 0 60px #9358FF66}
  #cam.on{display:block}
  #calib{position:fixed;left:0;right:0;top:calc(6vh + min(36vw,360px)*.62);text-align:center;z-index:6;pointer-events:none}
  #calib .big{font-size:clamp(56px,12vmin,120px)}
  #calib .txt{font-size:clamp(22px,3.6vmin,38px)}
  #calib .sub{font-size:clamp(16px,2.4vmin,24px);color:#F8FAFF88;margin-top:8px}
  #dot{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));width:12px;height:12px;border-radius:50%;
    background:var(--pink);box-shadow:0 0 12px var(--pink);z-index:6}
  #bar{position:fixed;left:50%;bottom:calc(3vh + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:14px;z-index:8;
    padding:12px 16px;border-radius:40px;background:#ffffff14;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid #ffffff2a;opacity:0;pointer-events:none;transition:opacity .35s}
  #bar.on{opacity:1;pointer-events:auto}
  .btn{min-width:72px;min-height:72px;border-radius:50%;border:1px solid #ffffff33;background:#ffffff1c;color:var(--white);
    font-size:32px;cursor:pointer;display:grid;place-items:center;transition:transform .1s,background .1s;padding:0}
  .btn:active{transform:scale(.9);background:#4DFFD055}
  .btn[disabled]{opacity:.3}
  .btn.rec{background:#FF4FC388}
  .modal{position:fixed;inset:0;display:grid;place-items:center;background:#050509cc;backdrop-filter:blur(10px);z-index:12}
  .card{padding:32px 40px;border-radius:32px;background:#0C0D15;border:1px solid #ffffff2a;text-align:center;box-shadow:0 0 90px #9358FF44}
  .card h2{margin:0 0 20px;font-size:clamp(24px,4vmin,38px);font-weight:600}
  .row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .opt{min-width:96px;min-height:96px;border-radius:28px;font-size:34px}
  .small{font-size:15px;color:#F8FAFF88;margin-top:14px}
  [dir=rtl] #bar{direction:ltr}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
